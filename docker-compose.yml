version: '3.9'

services:
  db:
    image: postgres:15
    container_name: lostcats-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lostcats
    ports:
      - "5432:5432"
    volumes:
      - lostcats-db:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: lostcats-api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lostcats
      JWT_SECRET: replace_me
      JWT_REFRESH_SECRET: replace_me
      ACCESS_TOKEN_TTL_MIN: 20
      REFRESH_TOKEN_TTL_DAYS: 14
      CORS_ORIGINS: http://localhost:3000
      CHIP_NUMBER_REGEX: ^[0-9]{8,20}$
      GCS_BUCKET: lostcats-photos
      PHOTO_MAX_MB: 10
      PHOTO_ALLOWED_MIME: image/jpeg,image/png,image/webp
    ports:
      - "3001:3001"

  web:
    build:
      context: ./frontend
    container_name: lostcats-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:3001/api/v1
    ports:
      - "3000:3000"

volumes:
  lostcats-db:
